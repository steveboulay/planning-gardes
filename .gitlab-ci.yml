stages:
  - test

backend:
  stage: test
  image: python:3.13-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
    UV_LINK_MODE: copy
    POSTGRES_DB: planning
    POSTGRES_USER: planning
    POSTGRES_PASSWORD: planning
    POSTGRES_HOST: postgres
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - .uv-cache
  before_script:
    - pip install --quiet uv==0.13.7
    - cd backend
  script:
    - uv sync --locked
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run python manage.py check
    - uv run python manage.py makemigrations --check --dry-run
    - uv run pytest
    - uv cache prune --ci
  services:
    - postgres:18
