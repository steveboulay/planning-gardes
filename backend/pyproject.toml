[project]
name = "planning-backend"
version = "0.1.0"
description = "Vérificateur de règles de planning de gardes"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
